[defaults]
roles_path = roles
# Host keys are checked. The first connection to a new server records its key
# (trust on first use); after that a changed key stops the run.
host_key_checking = True
interpreter_python = auto_silent
# Connection and privilege escalation timeout. The default 10 s is occasionally too short
# for sudo to print its prompt on a small, busy virtual server.
timeout = 30
stdout_callback = default
# Secrets from the vault are never printed, even with -v.
display_args_to_stdout = False

[ssh_connection]
pipelining = True
