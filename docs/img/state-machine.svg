<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Connection state machine: Disconnected, Connecting, Connected, Switching, Disconnecting and Faulted, with the allowed transitions between them">
  <defs>
    <style>
      .st    { fill: none; stroke: #7d8994; stroke-width: 1.6; }
      .stOk  { stroke: #2f8f86; stroke-width: 2; }
      .stBad { stroke: #b4646f; stroke-width: 2; }
      .name  { font: 600 14px ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b95a1; text-anchor: middle; }
      .nameOk{ fill: #2f8f86; }
      .nameBad{ fill: #b4646f; }
      .edge  { stroke: #7d8994; stroke-width: 1.4; fill: none; marker-end: url(#a1); }
      .fault { stroke: #b4646f; stroke-width: 1.3; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
      .lab   { font: 400 12px ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; fill: #7d8994; }
      .labB  { font: 400 12px ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b4646f; }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8994"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4646f"/>
    </marker>
  </defs>

  <rect class="st" x="30"  y="150" width="150" height="54" rx="27"/>
  <text class="name" x="105" y="183">Disconnected</text>

  <rect class="st" x="250" y="150" width="150" height="54" rx="27"/>
  <text class="name" x="325" y="183">Connecting</text>

  <rect class="st stOk" x="470" y="150" width="150" height="54" rx="27"/>
  <text class="name nameOk" x="545" y="183">Connected</text>

  <rect class="st" x="690" y="60" width="150" height="54" rx="27"/>
  <text class="name" x="765" y="93">Switching</text>

  <rect class="st" x="470" y="310" width="150" height="54" rx="27"/>
  <text class="name" x="545" y="343">Disconnecting</text>

  <rect class="st stBad" x="250" y="310" width="150" height="54" rx="27"/>
  <text class="name nameBad" x="325" y="343">Faulted</text>

  <!-- happy path -->
  <path class="edge" d="M 182 177 L 246 177"/>
  <text class="lab" x="188" y="168">connect</text>
  <path class="edge" d="M 402 177 L 466 177"/>
  <text class="lab" x="406" y="168">handshake</text>

  <!-- switching -->
  <path class="edge" d="M 600 152 C 640 122, 676 104, 686 99"/>
  <text class="lab" x="606" y="128">switch</text>
  <path class="edge" d="M 758 118 C 716 142, 656 160, 624 168"/>
  <text class="lab" x="664" y="150">new gateway up</text>

  <!-- teardown -->
  <path class="edge" d="M 545 208 L 545 306"/>
  <text class="lab" x="554" y="262">disconnect</text>
  <path class="edge" d="M 470 352 C 380 404, 190 396, 118 212"/>
  <text class="lab" x="214" y="400">interface is down</text>

  <!-- cancel mid handshake -->
  <path class="edge" d="M 398 204 C 430 250, 450 300, 466 322"/>
  <text class="lab" x="420" y="296">user cancels</text>

  <!-- faults -->
  <path class="fault" d="M 290 206 L 290 306"/>
  <text class="labB" x="180" y="244">handshake fails</text>
  <path class="fault" d="M 478 196 C 440 236, 410 280, 400 306"/>
  <text class="labB" x="430" y="242">tunnel drops</text>
  <path class="fault" d="M 466 332 L 404 332"/>
  <text class="labB" x="438" y="372">teardown fails, so a broken</text>
  <text class="labB" x="438" y="388">teardown is never reported clean</text>

  <!-- out of faulted -->
  <path class="edge" d="M 356 306 L 356 208"/>
  <text class="lab" x="364" y="252">retry</text>
  <path class="edge" d="M 252 322 C 180 306, 128 258, 112 210"/>
  <text class="lab" x="112" y="274">give up</text>

</svg>
